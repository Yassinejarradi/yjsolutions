; php.ini de JY Solutions Gestion (PHP 8.4 NTS x64, Windows).
; Ce fichier reste dans le dossier php\ : décompressez le PHP téléchargé dans ce même dossier (le zip de PHP
; ne contient pas de php.ini, il n'écrase donc rien).

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 120
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 20M
upload_max_filesize = 16M
max_file_uploads = 20
default_charset = "UTF-8"
file_uploads = On
allow_url_fopen = On
variables_order = "GPCS"
request_order = "GP"

; Dossier des extensions : chemin complet, écrit par install.bat (PHP chercherait sinon dans C:\php\ext,
; et un chemin relatif ne marche pas : le serveur lance un second PHP depuis le dossier public\).
extension_dir = "ext"

; Extensions demandées par l'application et ses bibliothèques
; (Laravel, Livewire, dompdf pour les PDF, PhpWord pour les fichiers Word).
; dom, xml, xmlwriter, libxml, ctype, tokenizer, iconv et bcmath sont déjà inclus dans php.exe.
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=fileinfo
extension=openssl
extension=gd
extension=zip
extension=intl
extension=curl
zend_extension=opcache

[Date]
date.timezone = Africa/Casablanca

[Session]
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
